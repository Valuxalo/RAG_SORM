[project]
name = "rag-sorm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Valuxalo", email = "cleo200997@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "docx>=0.2.4",
    "flagembedding>=1.4.2",
    "langfuse>=5,<6",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "striprtf>=0.0.35",
]

[project.scripts]
rag-sorm = "rag_sorm:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 130
indent-width = 4

[tool.ruff.lint]
# Проверяем ошибки, импорты и потенциальные ошибки в коде
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
]

# Игнорируем некоторые правила
ignore = []

# Разрешаем автоматическое исправление
fixable = ["ALL"]

[tool.ruff.format]
# Двойные кавычки
quote-style = "double"

# Отступы пробелами
indent-style = "space"

# Автоматическое форматирование переносов
line-ending = "auto"
